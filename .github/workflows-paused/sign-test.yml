name: signing test

# A trial run of the SignPath signing that release.yml uses, with the test certificate: it builds the Windows agent,
# signs PhoneBoxAgent.exe and keeps the signed file as a workflow artifact for a week. Nothing is released.

on:
  workflow_dispatch:
    inputs:
      signing-policy:
        description: SignPath signing policy
        default: test-signing
        type: choice
        options: [test-signing, release-signing]

permissions:
  contents: read

concurrency:
  group: sign-test
  cancel-in-progress: false

jobs:
  sign:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Publish (self-contained, single file)
        run: dotnet publish agent/PhoneBox.Agent -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -o out --nologo
      - uses: ./.github/actions/sign-windows-agent
        with:
          exe: out/PhoneBoxAgent.exe
          signing-policy: ${{ inputs.signing-policy }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          trusted: ${{ inputs.signing-policy == 'release-signing' }}
      - name: Smoke-test the signed agent
        shell: pwsh
        run: |
          $v = ([xml](Get-Content agent/PhoneBox.Agent/PhoneBox.Agent.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          python tools/smoke-agent.py out/PhoneBoxAgent.exe --version $v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-PhoneBoxAgent-${{ inputs.signing-policy }}
          path: out/PhoneBoxAgent.exe
          retention-days: 7
